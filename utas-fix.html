ol.model{padding-left:18px}ol.model li{margin:6px 0}

.pop.case{top:64px;bottom:12px;overflow:auto;-webkit-overflow-scrolling:touch}.pop.case h3{margin:14px 0 4px;color:var(--gold);font-size:16px}.pop.case p{margin:6px 0;font-size:15px}.grp{border-left:3px solid var(--gold);padding-left:10px;margin:14px 0 4px;font-weight:700;color:var(--gold)}
.scorebig{font-size:54px;font-weight:800;color:var(--gold);font-family:Cambria,Georgia,serif;line-height:1}

</style>

<script>
// Shared glossary and command words for the IGCSE Business 0264 review games. All businesses and figures are fictional.
const GLOSSARY = {

  "off-the-job training": "Training away from the workplace, for example at a college or on a course.",

  "laissez-faire leadership": "The leader lets workers make most decisions themselves.",

  "extension strategy": "An action to stop sales falling and make a product's life longer.",
  "cost-plus pricing": "The price is the cost per unit plus a percentage mark-up for profit.",
  "penetration pricing": "A low price at the start to win customers and market share quickly.",

Object.assign(GLOSSARY, {

  "market research": "Collecting information about customers, competitors and the market."
});

Object.assign(GLOSSARY, {

  { id: "u5s7", type: "write", topic: "1.3", exam: true, cmd: "Justify", part: "Question 2(b) · step 2 of 2", label: "decide · 6 of the 12", marks: 6, q: "Which way should UF choose? Justify your answer using Appendix 2.", task: "Write your recommendation in your notebook: 4 to 6 sentences.",

    model: S => ({
      own: "<p>UF should open its own new kiosks. Tulga's 50,000,000₮ pays for 2 kiosks (25,000,000₮ each) with no loan and no interest, and UF would have 4 kiosks, the same as Screen Doctor. Tulga keeps full control of how every phone is repaired.</p><p>Taking over PhoneLab is too risky because UF must borrow 70,000,000₮. Taking over PartsHub is worse because it brings no new kiosks or customers.</p><p>However, internal growth is slow. This will only work if UF finds good mall places before Screen Doctor takes them.</p>",

    })[S.vars.q2 || "own"], rules: RULES_B }

  steps: [
  { id: "u7s1", type: "story", chip: "Question 3(b) · 12 marks", title: "The question", text: `<p class="q">UF is losing customers to Screen Doctor. Consider the following <b>three</b> ways UF could respond:</p><p>• cut its prices<br>• start a one-hour repair service<br>• start a loyalty card: 10% off the next repair</p><p class="q">Which way should UF choose? Justify your answer using Appendix 3. <b>[12]</b></p>` + APP3 },

  { id: "u7s3", type: "sort", topic: "3.1", marks: 2, q: "🎯 Match the best response to each change in the market.", cats: ["New or improved product", "Lower costs", "Better service and loyalty"], items: [["Customers' needs have changed", 0], ["A rival starts a price war", 1], ["A rival tries to take your regular customers", 2]], explain: "Match the response to the change. A change in what customers want needs a <b>product</b> answer. A price war needs a <b>cost</b> answer." },
  { id: "u7s4", type: "mcq", topic: "3.1", marks: 1, q: "A UF screen repair costs 60,000₮. A loyalty card gives 10% off the next repair. How much does the customer save?", opts: ["6,000₮", "600₮", "10,000₮", "54,000₮"], a: 0, explain: "60,000 × 10 ÷ 100 = <b>6,000₮</b>. The customer pays 54,000₮ next time, so there is a reason to come back. 🎁" },
  { id: "u7s5", type: "build", topic: "3.1", exam: true, cmd: "Consider", part: "Question 3(b) · step 1 of 2", label: "discuss · 6 of the 12", marks: 6, group: 2, tags: null, plainJoin: true, heads: ["Cut prices", "One-hour repair service", "Loyalty card"],

    guide: ["Say your choice.", "Give your main reason. Use a number from Appendix 3.", "Say why the other two ways are worse for UF.", "Finish with a condition: 'This will only work if...'"], frame: FRAME3, points: TICKS3, modelTitle: "Model recommendation for your choice",
    model: S => ({
      price: "<p>UF should cut its prices. Screen Doctor's prices are lower, and a price cut can start tomorrow at no cost, while the one-hour machines cost 30,000,000₮ for 2 kiosks. It could win back the 50 customers (25%) who said a low price is most important.</p><p>The one-hour service is worse because it uses most of Tulga's 50,000,000₮ savings. The loyalty card is worse because it only helps customers who already use UF.</p><p>However, only 25% of customers chose price, and Screen Doctor may cut its prices again. This will only work if UF can also lower its costs, so that it still makes a profit.</p>",

      loyal: "<p>UF should start a loyalty card. It costs very little, so Tulga keeps his 50,000,000₮ savings for growth. 10% off the next repair (6,000₮ on a 60,000₮ repair) gives customers a reason to come back, and keeping a customer costs less than finding a new one.</p><p>Cutting all prices is worse because every repair earns less profit, not only repeat repairs. The one-hour service is worse because the machines cost 30,000,000₮.</p><p>However, 60% of customers want a fast repair, and the card does not fix the two-day wait. This will only work for a short time: UF must also get faster later.</p>"
    })[S.vars.q3 || "fast"], rules: RULES_B }
  ] },

  { id: "u9s3", type: "num", topic: "1.4", marks: 2, unit: "₮", q: "A franchisee's kiosk has sales of 15,000,000₮ a month. The [[royalty]] is 6% of sales. How much does UF receive each month from this franchisee?", formula: "Royalty = sales × royalty % ÷ 100", answer: 900000, explain: "15,000,000 × 6 ÷ 100 = <b>900,000₮</b> a month. UF also gets a fee of 8,000,000₮ when the franchisee starts." },
  { id: "u9s4", type: "mcq", topic: "1.4", marks: 1, q: "A UF franchisee in Erdenet uses cheap screens that break after a week. Who do customers blame?", opts: ["The UF brand", "Only the franchisee", "MobiNet", "Nobody"], a: 0, explain: "Customers see the UF name. A bad [[franchisee]] can damage the brand of the [[franchisor]]. ⚠️" },
  { id: "u9s5", type: "story", chip: "Idea menu", title: "Ideas you can use", text: `<p>📓 Pick ideas from this menu. Add facts from Appendix 4.</p><div class="data"><div><b>🤝 Sell franchises</b></div><div>✅ It costs UF 0₮. Each franchisee pays a fee of 8,000,000₮ and a royalty of 6% of sales.</div><div>✅ Two people have already asked, so growth is fast.</div><div>⚠️ The franchisee runs the repairs. Poor repairs damage the UF name.</div></div><div class="data"><div><b>📶 Joint venture with MobiNet</b></div><div>✅ MobiNet has shops in every city, with customers who own phones.</div><div>✅ UF technicians do the repairs, so UF controls the quality.</div><div>⚠️ UF pays 20,000,000₮ and gets only half of the profit. The two businesses may disagree.</div></div>` },
  { id: "u9s6", type: "write", topic: "1.4", exam: true, cmd: "Justify", part: "Question 4(b)", marks: 12, q: "Consider the two ways: selling franchises and a joint venture with MobiNet. Which way should UF choose? Justify your answer using Appendix 4.", task: "Write your full answer in your notebook: two paragraphs and a decision.",
    guide: ["Paragraph 1: franchises. One point for, one point against, with the case.", "Paragraph 2: the joint venture. The same.", "Decision: your choice, your best reason and why the other way is worse."],
    frame: ["Selling franchises would ... because ... However, ...", "A joint venture with MobiNet would ... because ... However, ...", "UF should choose ... because ...", "This is better than ... because ...", "However, this will only work if ..."],
    levels: [[12, "Level 3: both ways discussed in detail with Appendix 4 + a clear choice + strong reasons + why the other way is worse."], [10, "Level 3: both ways discussed in detail with the case + a choice with good reasons."], [8, "Level 2: both ways discussed with the case + a choice with a simple reason."], [6, "Level 2: one way discussed in detail with the case + a choice."], [4, "Level 1: simple points about both ways, using the case."], [2, "Level 1: one or two simple points. No case."], [0, "Nothing correct, or nothing written."]],
    model: "<p><b>Selling franchises</b> costs UF nothing, because each franchisee pays to open the kiosk. UF receives a fee of 8,000,000₮ from each franchisee and a royalty of 6% of sales, and two people have already asked, so UF could be in Darkhan and Erdenet quickly. However, the franchisee runs the repairs, so poor work in another city could damage the UF name.</p><p><b>A joint venture with MobiNet</b> gives UF a place in shops in every city, where customers already come with their phones. UF technicians do the repairs, so UF controls the quality. However, UF must pay 20,000,000₮, half of the set-up cost, and it gets only half of the profit. UF and MobiNet may also disagree about how to run the desks.</p><p><b>Decision:</b> UF should choose the joint venture. UF's biggest problem is that customers are leaving for a better service, so it must protect the quality of its repairs, and in a joint venture its own technicians do the work. It is better than franchising, because Tulga cannot check franchisees in other cities every day. Half of the profit from many busy MobiNet shops may also be more than a 6% royalty. However, this will only work if UF and MobiNet agree clearly who decides what.</p>",
    rules: ["Marked by levels: Level 1 = 1-4, Level 2 = 5-8, Level 3 = 9-12.", "Level 3 needs both ways discussed in detail and a well-justified choice.", "For the top marks, say why you rejected the other way.", "Any way can win. The model chooses the joint venture: you may choose franchises.", "Be honest: mark what is in your notebook, not what is in your head."] },
  { id: "u9s7", type: "story", title: "Case closed", text: `<p>📱 Tulga reads your advice. He smiles. <i>"Now I know what to do, and why."</i></p><p>📓 Keep your notebook open at your 12-mark answer. Mr. Chris may check that your level matches your writing.</p><p>👉 Tap <b>Continue</b> to see your Adviser's Report.</p>` }
  ] }

    h += `<div class="bands">${st.levels.map((l, i) => `<button class="${pick === i ? "sel" : ""}" data-act="lvl" data-i="${i}" ${r ? "disabled" : ""}><b>${l[0]}</b>${gl(l[1])}</button>`).join("")}</div>`;
    mark = pick === undefined ? undefined : st.levels[pick][0];
  } else {
    const t = r ? r.ticks : (ui.ticks || {});
    h += `<div class="ticks">${st.points.map((p, i) => `<label class="${t[i] ? "on" : ""}"><input type="checkbox" data-act="tick" data-i="${i}" ${t[i] ? "checked" : ""} ${r ? "disabled" : ""}><span>${gl((p.tag ? "[" + p.tag + "] " : "") + val(p.t))}</span></label>`).join("")}</div>`;
    mark = st.points.filter((_, i) => t[i]).length;
  }
  if (!r) h += `<div class="row"><button class="btn" data-act="wsave" ${mark === undefined ? "disabled" : ""}>Confirm: ${mark === undefined ? "?" : mark} of ${st.marks}</button></div>`;
  else h += `<div class="fb"><b class="t">Mark recorded: ${r.earned} of ${st.marks} <span class="earn">+${fmt(r.earned)}</span></b>Mr. Chris may check your notebook against this mark.</div>${nextBtn()}`;
  return h + "</div>";
}
function chapterScore(i){ let e = 0, m = 0; Object.values(S.res).forEach(x => { if (x.ch === i && x.max) { e += x.earned; m += x.max; } }); return [e, m]; }
function endScreen(){
  const c = ch(); const [e, m] = chapterScore(S.ch);
  const last = S.ch === CHAPTERS.length - 1;
  return heroFor(c) + `<div class="card"><div class="chips"><span class="chip story">Chapter complete</span></div><h2>✅ ${c.title}</h2>
<p>This chapter: <b>${fmt(e)} of ${m}</b> marks and points.</p><p>${GAME.valName || "Brand value"}: <span class="earn">${fmt(S.val)}${GAME.valLong === undefined ? " million ₮" : GAME.valLong}</span></p>
<p>👥 <b>Talk to your neighbour:</b> ${GAME.endTalk || "did they make a different decision? What happened to them?"}</p></div>
<div class="card"><h2>While you wait: key terms</h2><p class="small">Say the meaning, then tap to check.</p><div class="flip">${c.terms.map((t, i) => `<button data-act="flip" data-i="${i}">${ui.flip && ui.flip[i] ? `<b>${t}</b><br>${GLOSSARY[t]}` : `<b>${t}</b><br><span class="small">Tap to check</span>`}</button>`).join("")}</div><p class="small" style="margin-top:8px">📓 Copy any word you missed into your notebook, with its meaning.</p></div>
<div class="row"><button class="btn" data-act="tonext">${last ? "See my " + (GAME.reportName || "Founder's Report") + " →" : "Next →"}</button></div>`;
}
function topicMap(){
  const t = {}; Object.values(S.res).forEach(x => { if (!x.max) return; t[x.topic] = t[x.topic] || [0, 0]; t[x.topic][0] += x.earned; t[x.topic][1] += x.max; });
  return t;
}
const PATHS = GAME.paths;
function totals(){ let e = 0, m = 0, xe = 0, xm = 0; allSteps().forEach(st => { if (!st.marks) return; const r = S.res[st.id]; if (st.exam) { xm += st.marks; if (r) xe += r.earned; } else { m += st.marks; if (r) e += r.earned; } }); return { xe, xm, e, m }; }
function allSteps(){ return CHAPTERS.flatMap(c => c.steps); }
function reportScreen(){
  const t = topicMap(); const keys = GAME.topics, names = GAME.names;
  let rows = "", weak = [];
  keys.forEach(k => { if (!t[k]) return; const p = t[k][0] / t[k][1]; const c = p >= .75 ? "g" : p >= .5 ? "a" : "r"; if (c !== "g" && k !== "Final") weak.push(k + " " + names[k]); rows += `<tr><td>${k} ${names[k]}</td><td><div class="bar"><i class="${c}" style="width:${Math.round(p * 100)}%"></i></div></td><td style="text-align:right">${Math.round(p * 100)}%</td></tr>`; });
  const x = totals(), tot = x.xe + x.e, max = x.xm + x.m;
  const v = S.val, title = (GAME.tiers.find(t => v >= t[0]) || GAME.tiers[GAME.tiers.length - 1])[1];
  const path = Object.keys(PATHS).filter(k => S.vars[k]).map(k => `<li>${PATHS[k][S.vars[k]]}</li>`).join("");
  return `<div class="card cert"><div class="chips" style="justify-content:center"><span class="chip story">${GAME.reportName || "Founder's Report"}</span></div><div class="name">${esc(S.name || GAME.roleName || "Founder")}</div><p class="small">${GAME.reportSub} · ${esc(S.vars.brand || "")}</p><div class="scorebig">${fmt(tot)} / ${max}</div><p><b>Total score</b> · ${Math.round(tot / max * 100)}%</p><p>📝 Exam parts: <b>${fmt(x.xe)} of ${x.xm}</b> marks · ✔️ Quick checks: <b>${fmt(x.e)} of ${x.m}</b> points</p><p>${GAME.valIcon || "🥟"} ${GAME.valName || "Brand value"} <span class="earn">${fmt(v)}${GAME.valLong === undefined ? " million ₮" : GAME.valLong}</span> · ${title}</p><p class="small">📱 Show this screen to Mr. Chris.</p></div>
<div class="card"><h2>Your revision map</h2><table class="map">${rows}</table><p style="margin-top:10px">${weak.length ? `🎯 <b>Revise first:</b> ${weak.join(", ")}. Reread these topics in your coursebook tonight.` : "🎯 Strong on every topic. Next step: full past Paper 1 and Paper 2 questions."}</p></div>
<div class="card"><h2>Your path</h2><ul class="path">${path}</ul><p class="small">${GAME.pathNote || "Different choices lead to different numbers and endings. Play again later to try another path."}</p><div class="row"><button class="btn ghost" data-act="reset">Play again</button></div></div>`;
}
function showMenu(){
  const cr = Object.values(CREDITS).filter((x, i, a) => a.indexOf(x) === i).map(x => `<li>${x}</li>`).join("");
  $("pop").innerHTML = `<div class="pop"><b>Menu</b><p class="small">Progress is saved on this device.</p><div class="row"><button class="btn teal" data-act="myscore">📱 Show my score now</button></div><div class="row"><button class="btn ghost" data-act="reset">Start again</button><button class="btn" data-act="popclose">Close</button></div><p class="small" style="margin-top:10px"><b>Photo credits</b></p><ul class="small">${cr}</ul><p class="small">All businesses, people and figures in the story are fictional.</p></div>`;
}
function showCase(){ $("pop").innerHTML = `<div class="pop case"><div class="row" style="justify-content:space-between;align-items:center;margin:0"><b>📄 ${GAME.caseTitle || "Case study"}</b><button class="btn" data-act="popclose">Close ✕</button></div>${gl(val(GAME.caseFile))}<div class="row"><button class="btn" data-act="popclose">Close ✕</button></div></div>`; }
function showScore(){ const x = totals(); $("pop").innerHTML = `<div class="pop" style="text-align:center"><b>${esc(S.name || GAME.roleName || "Founder")}</b> · ${esc(S.vars.brand || "")}<div class="scorebig" style="margin:8px 0">${fmt(x.xe + x.e)} / ${x.xm + x.m}</div><p class="small">Score so far · reached ${GAME.chapterWord || "Chapter"} ${S.ch + 1} of ${CHAPTERS.length}<br>Exam parts ${fmt(x.xe)} of ${x.xm} · Quick checks ${fmt(x.e)} of ${x.m}</p><div class="row" style="justify-content:center"><button class="btn" data-act="popclose">Close</button></div></div>`; }

document.addEventListener("click", ev => {
  const b = ev.target.closest("[data-act]"); if (!b) { if (!ev.target.closest(".pop")) $("pop").innerHTML = ""; return; }
  const a = b.dataset.act, st = (S.screen === "play") ? step() : null;
  if (a === "term") { const k = b.dataset.term; $("pop").innerHTML = `<div class="pop"><b>${k}</b><br>${GLOSSARY[k]}</div>`; ev.stopPropagation(); return; }
  if (a === "menu") return showMenu();
  if (a === "myscore") return showScore();
  if (a === "case") return showCase();
  if (a === "mute") { S.mute = !S.mute; save(); return header(); }
  if (a === "key") {
    const k = b.dataset.k; ui.code = ui.code || ""; ui.codeErr = false;
    if (k === "⌫") ui.code = ui.code.slice(0, -1);
    else if (k === "✓") {
      if (ui.code === MASTER) S.master = true;
      if (ui.code === ch().code || ui.code === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); fanfare(); return render(); }
      ui.codeErr = true; ui.code = ""; thud();
    } else if (ui.code.length < 6) ui.code += k;
    return render();
  }
  if (a === "popclose") { $("pop").innerHTML = ""; return; }
  if (a === "reset") {
    if (!ui.confirmReset) { ui.confirmReset = true; b.textContent = "Tap again to erase my progress"; return; }
    S = fresh(); ui = {}; save(); $("pop").innerHTML = ""; return render();
  }
  if (a === "startgo") { S.name = ($("nm").value || "").trim().slice(0, 24); S.screen = "gate"; S.ch = 0; save(); return render(); }
  if (a === "code") {
    const v = ($("code").value || "").trim().toUpperCase();
    if (v === MASTER) S.master = true;
    if (v === ch().code || v === MASTER) { S.unlocked[S.ch] = true; S.screen = "play"; S.step = 0; ui = {}; save(); return render(); }
    ui.codeErr = true; return render();
  }
  if (a === "next") { ui = {}; let n = S.step + 1; while (n < ch().steps.length && ch().steps[n].show && !ch().steps[n].show(S)) n++; if (n < ch().steps.length) S.step = n; else S.screen = "end"; save(); return render(); }
  if (a === "tonext") {
    ui = {};
    if (S.ch === CHAPTERS.length - 1) { S.screen = "report"; save(); return render(); }
    S.ch++; S.step = 0; S.screen = (S.master || S.unlocked[S.ch]) ? "play" : "gate"; save(); return render();
  }
  if (a === "flip") { ui.flip = ui.flip || {}; ui.flip[b.dataset.i] = !ui.flip[b.dataset.i]; return render(); }
  if (!st) return;
  if (a === "choose" && !S.res[st.id]) {
    const i = +b.dataset.i, o = st.opts[i];
    if (o.lock && o.lock(S)) return;
    Object.assign(S.vars, o.set || {});
    const d = o.valFn ? o.valFn(S) : o.val;
    const after = st.after ? st.after(S) : "";
    S.res[st.id] = { done: true, pick: i, delta: d, after, ch: S.ch, max: 0, earned: 0 };
    addVal(d); save(); return render();
  }
  if (a === "mcq") {
    const i = +b.dataset.i; ui.tries = ui.tries || (S.tries && S.tries[st.id] ? S.tries[st.id].slice() : []);
    if (ui.tries.includes(i)) return;
    ui.tries.push(i); (S.tries = S.tries || {})[st.id] = ui.tries; save();
    if (i === st.a) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2 || val(st.opts).length === 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "sortpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.i] = +b.dataset.c; return render(); }
  if (a === "sortcheck") {
    const right = st.items.filter((it, i) => ui.pick[i] === it[1]).length;
    (right === st.items.length ? ding : right ? () => {} : thud)();
    return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { pick: ui.pick, right });
  }
  if (a === "numcheck") {
    const raw = $("ans").value; const x = parseNum(raw); ui.tries = ui.tries || (S.tries && S.tries[st.id] ? S.tries[st.id].slice() : []);
    if (raw.trim() === "") return;
    ui.tries.push(raw); (S.tries = S.tries || {})[st.id] = ui.tries; save();
    if (close(x, val(st.answer))) { ding(); return record(st, ui.tries.length === 1 ? st.marks : st.marks / 2, { tries: ui.tries }); }
    thud();
    if (ui.tries.length >= 2) return record(st, 0, { tries: ui.tries });
    return render();
  }
  if (a === "buildpick") { ui.pick = ui.pick || {}; ui.pick[b.dataset.s] = +b.dataset.o; return render(); }
  if (a === "buildcheck") { const sl = val(st.slots); const right = sl.filter((_, i) => ui.pick[i] === 0).length; (right === sl.length ? ding : () => {})(); return record(st, right * st.marks / sl.length, { pick: ui.pick, right }); }
  if (a === "orderpick") { ui.seq = ui.seq || []; ui.seq.push(+b.dataset.i); return render(); }
  if (a === "orderundo") { ui.seq.pop(); return render(); }
  if (a === "ordercheck") { const right = ui.seq.filter((x, p) => x === p).length; if (right === st.items.length) ding(); return record(st, Math.round(st.marks * right / st.items.length * 2) / 2, { seq: ui.seq, right }); }
  if (a === "stmtcheck") {
    const rows = val(st.rows); const ans = {}, ok = {}; let n = 0, right = 0;
    document.querySelectorAll("input[data-row]").forEach(inp => {
      const i = +inp.dataset.row; ans[i] = inp.value; n++;
      const x = parseNum(inp.value), want = Math.abs(rows[i][2]);
      ok[i] = !isNaN(x) && Math.abs(Math.abs(x) - want) <= 0.051; if (ok[i]) right++;
    });
    return record(st, Math.round(st.marks * right / n * 2) / 2, { ans, ok, right, n });
  }
  if (a === "nbreveal") { ui.reveal = true; return render(); }
  if (a === "nbpick") { ui.nb = +b.dataset.n; return render(); }
  if (a === "nbsave") return record(st, ui.nb, {});
  if (a === "lvl") { ui.lvl = +b.dataset.i; return render(); }
  if (a === "tick") { ui.ticks = ui.ticks || {}; ui.ticks[b.dataset.i] = b.checked; return render(); }
  if (a === "wsave") { const m = st.levels ? st.levels[ui.lvl][0] : st.points.filter((_, i) => (ui.ticks || {})[i]).length; return record(st, m, st.levels ? { lvl: ui.lvl } : { ticks: ui.ticks || {} }); }
});
document.addEventListener("keydown", e => { if (S.screen === "gate" && /^[0-9]$|^Backspace$|^Enter$/.test(e.key)) { const k = e.key === "Backspace" ? "⌫" : e.key === "Enter" ? "✓" : e.key; const btn = document.querySelector(`[data-act="key"][data-k="${k}"]`); if (btn) btn.click(); return; } if (e.key === "Enter") { const c = document.querySelector('[data-act="numcheck"]'); if (c && document.activeElement && document.activeElement.tagName === "INPUT") c.click(); } });
render();
